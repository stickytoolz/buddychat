name: BuddyChat
options:
  bundleIdPrefix: com.stickytoolz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BuddyChat:
    type: application
    platform: iOS
    sources:
      - BuddyChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stickytoolz.buddychat
        PRODUCT_NAME: BuddyChat
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: BuddyChat/Info.plist
      properties:
        CFBundleDisplayName: BuddyChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: BuddyChat lets you pick your own picture for your skin.
schemes:
  BuddyChat:
    build:
      targets:
        BuddyChat: all
